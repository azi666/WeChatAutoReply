name: Build WeChatAutoReply

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot dpkg perl git curl xz-utils make clang lld \
            libxml2-dev pkg-config

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Build ldid from Theos vendor source
        run: |
          # Theos vendor/ldid contains source + prebuilt binaries.
          # Try prebuilt first; fall back to compiling from source.
          if [ -x "$THEOS/vendor/ldid/ldid" ]; then
            cp "$THEOS/vendor/ldid/ldid" "$THEOS/bin/ldid"
            chmod +x "$THEOS/bin/ldid"
            echo "Using prebuilt ldid from vendor/ldid"
          else
            cd "$THEOS/vendor/ldid"
            make
            cp ldid "$THEOS/bin/ldid"
            chmod +x "$THEOS/bin/ldid"
            echo "Built ldid from source"
          fi
          ls -la "$THEOS/bin/ldid"

      - name: Install iPhoneOS 16.5 SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -r /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build tweak
        run: |
          export PATH="$THEOS/bin:$PATH"
          echo "THEOS=$THEOS"
          which ldid && ldid --version 2>&1 || true
          make package FINALPACKAGE=1

      - name: Upload dylib (for TrollStore injection)
        uses: actions/upload-artifact@v4
        with:
          name: WeChatAutoReply-dylib
          path: .theos/obj/WeChatAutoReply.dylib
          if-no-files-found: error

      - name: Upload deb (for jailbroken devices)
        uses: actions/upload-artifact@v4
        with:
          name: WeChatAutoReply-deb
          path: packages/*.deb
          if-no-files-found: error
