name: Build WeChatAutoReply

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot dpkg perl git curl xz-utils make clang lld libxml2-dev

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          # Theos ships prebuilt ldid; ensure it's executable
          chmod +x "$THEOS"/bin/ldid 2>/dev/null || true
          ls -la "$THEOS"/bin/ | head -30

      - name: Install iPhoneOS 16.5 SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -r /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build tweak
        env:
          PATH: ${{ github.workspace }}/theos/bin:${{ env.PATH }}
        run: |
          echo "THEOS=$THEOS"
          which ldid || echo "ldid not in PATH"
          make package FINALPACKAGE=1

      - name: Upload dylib (for TrollStore injection)
        uses: actions/upload-artifact@v4
        with:
          name: WeChatAutoReply-dylib
          path: .theos/obj/WeChatAutoReply.dylib
          if-no-files-found: error

      - name: Upload deb (for jailbroken devices)
        uses: actions/upload-artifact@v4
        with:
          name: WeChatAutoReply-deb
          path: packages/*.deb
          if-no-files-found: error
