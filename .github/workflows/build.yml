name: Build WeChatAutoReply

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot dpkg perl git curl xz-utils make clang lld \
            libxml2-dev pkg-config

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Install ldid
        run: |
          # Download theos/ldid source tarball via codeload (no git auth needed)
          # and compile it. ldid is a single C++ source depending on libxml2.
          curl -fsSL -o /tmp/ldid.tar.gz \
            https://codeload.github.com/theos/ldid/tar.gz/refs/heads/master
          tar -xzf /tmp/ldid.tar.gz -C /tmp
          cd /tmp/ldid-master
          # Try the repo Makefile first; fall back to manual compile
          if [ -f Makefile ]; then
            make INSTALL_PREFIX=/usr 2>&1 | tail -5 || true
          fi
          if [ -f ldid ]; then
            cp ldid "$THEOS/bin/ldid"
          else
            clang++ -O2 -o "$THEOS/bin/ldid" ldid.cpp -lxml2 -lz -lpthread
          fi
          chmod +x "$THEOS/bin/ldid"
          ls -la "$THEOS/bin/ldid"
          "$THEOS/bin/ldid" --version 2>&1 || true

      - name: Install iPhoneOS 16.5 SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -r /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build tweak
        run: |
          export PATH="$THEOS/bin:$PATH"
          echo "THEOS=$THEOS"
          which ldid && ldid --version 2>&1 || true
          make package FINALPACKAGE=1

      - name: Upload dylib (for TrollStore injection)
        uses: actions/upload-artifact@v4
        with:
          name: WeChatAutoReply-dylib
          path: .theos/obj/WeChatAutoReply.dylib
          if-no-files-found: error

      - name: Upload deb (for jailbroken devices)
        uses: actions/upload-artifact@v4
        with:
          name: WeChatAutoReply-deb
          path: packages/*.deb
          if-no-files-found: error
